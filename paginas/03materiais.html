    <!-- ***** PARTE IMUTÁVEL ***** -->
    <!-- O <script> no final contém o código que faz os componentes interativos funcionarem. Não edite. -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const track = document.querySelector('.carousel-track');
            if (track) { /* Código do Carrossel (imutável) */ const slides = Array.from(track.children); if (slides.length > 0) { const nextButton = document.getElementById('nextBtn'); const prevButton = document.getElementById('prevBtn'); const dotsContainer = document.getElementById('dots-container'); let currentIndex = 0; const loadSlideContent = (index) => { const slide = slides[index]; if (!slide) return; const img = slide.querySelector('img'); if (img && img.dataset.src) { img.src = img.dataset.src; img.removeAttribute('data-src'); } }; const moveToSlide = (targetIndex) => { if (slides.length === 0) return; const slideWidth = slides[0].getBoundingClientRect().width; if (!slideWidth) return; loadSlideContent(targetIndex); track.style.transform = `translateX(-${slideWidth * targetIndex}px)`; currentIndex = targetIndex; updateUI(); }; const updateUI = () => { if (slides.length === 0 || !dotsContainer) return; const dots = Array.from(dotsContainer.children); dots.forEach((dot, index) => { dot.classList.toggle('bg-white', index === currentIndex); dot.classList.toggle('bg-white/50', index !== currentIndex); }); if (prevButton) prevButton.disabled = (currentIndex === 0); if (nextButton) nextButton.disabled = (currentIndex === slides.length - 1); }; const setupCarousel = () => { if (slides.length === 0 || !dotsContainer) return; dotsContainer.innerHTML = ''; slides.forEach((_, index) => { const dot = document.createElement('button'); dot.classList.add('w-3', 'h-3', 'rounded-full', 'transition-colors'); dotsContainer.appendChild(dot); dot.addEventListener('click', () => moveToSlide(index)); }); const slideWidth = slides[0].getBoundingClientRect().width; if (!slideWidth) return; track.style.transition = 'none'; track.style.transform = `translateX(-${slideWidth * currentIndex}px)`; setTimeout(() => { track.style.transition = 'transform 0.5s ease-in-out'; }, 50); updateUI(); loadSlideContent(currentIndex); }; if (nextButton && prevButton) { nextButton.addEventListener('click', () => { if (currentIndex < slides.length - 1) { moveToSlide(currentIndex + 1); } }); prevButton.addEventListener('click', () => { if (currentIndex > 0) { moveToSlide(currentIndex - 1); } }); } window.addEventListener('resize', setupCarousel); setTimeout(setupCarousel, 100); } }
            const accordionHeaders = document.querySelectorAll('.accordion-header');
            accordionHeaders.forEach(header => { /* Código do Acordeão (imutável) */ header.addEventListener('click', () => { const accordionContent = header.nextElementSibling; header.classList.toggle('active'); if (accordionContent.style.maxHeight) { accordionContent.style.maxHeight = null; } else { accordionContent.style.maxHeight = accordionContent.scrollHeight + 'px'; } }); });
            const openModalBtn = document.getElementById('openModalBtn');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modal-content');
            if (openModalBtn && modal && closeModalBtn && modalContent) { /* Código do Modal (imutável) */ const openModal = () => { modal.classList.remove('hidden'); void modal.offsetWidth; modal.classList.add('opacity-100'); modalContent.classList.add('scale-100'); }; const closeModal = () => { modal.classList.remove('opacity-100'); modalContent.classList.remove('scale-100'); setTimeout(() => { modal.classList.add('hidden'); }, 300); }; openModalBtn.addEventListener('click', openModal); closeModalBtn.addEventListener('click', closeModal); modal.addEventListener('click', (event) => { if (event.target === modal) { closeModal(); } }); }
        });
    </script>
