<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrossel de GIFs - Libras</title>
<style>
body {
  background-color: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.gif-carousel {
  max-width: 90vw;
  max-height: 80vh;
  position: relative;
  overflow: hidden;
}
.carousel-slide {
  display: none;
  text-align: center;
}
.carousel-slide img {
  max-width: 100%;
  max-height: 80vh;
  height: auto;
  width: auto;
  object-fit: contain;
  border-radius: 8px;
  background-color: #000;
}
.numbertext {
  position: absolute;
  top: 0;
  left: 0;
  padding: 6px 10px;
  color: #fff;
  background-color: rgba(0,0,0,0.4);
  border-radius: 0 0 5px 0;
  font-size: 14px;
}
.prev, .next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  padding: 12px;
  color: white;
  font-weight: bold;
  font-size: 24px;
  background-color: rgba(0,0,0,0.3);
  border-radius: 50%;
  user-select: none;
  cursor: pointer;
}
.prev { left: 10px; }
.next { right: 10px; }
.prev:hover, .next:hover {
  background-color: rgba(0,0,0,0.6);
}
.fade {
  animation: fade 0.8s;
}
@keyframes fade {
  from {opacity: 0.4;}
  to {opacity: 1;}
}
</style>
</head>
<body>

<div class="gif-carousel">
  <div class="carousel-slide fade">
    <div class="numbertext">1 / 3</div>
    <img src="https://raw.githubusercontent.com/humbertoman/gifs_notion/refs/heads/main/gifs/ajudar.gif" alt="GIF 1">
  </div>
  <div class="carousel-slide fade">
    <div class="numbertext">2 / 3</div>
    <img src="https://freeimage.host/i/KrKpnvS" alt="GIF 2">
  </div>
  <div class="carousel-slide fade">
    <div class="numbertext">3 / 3</div>
    <img src="https://raw.githubusercontent.com/humbertoman/gifs_notion/refs/heads/main/gifs/agua.gif" alt="GIF 3">
  </div>

  <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
  <a class="next" onclick="plusSlides(1)">&#10095;</a>
</div>

<script>
let slideIndex = 1;
showSlides(slideIndex);

function plusSlides(n) {
  showSlides(slideIndex += n);
}
function showSlides(n) {
  let slides = document.getElementsByClassName("carousel-slide");
  if (n > slides.length) {slideIndex = 1}
  if (n < 1) {slideIndex = slides.length}
  for (let i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }
  slides[slideIndex-1].style.display = "block";
}
setInterval(() => { plusSlides(1); }, 6000); // muda a cada 6s
</script>

</body>
</html>
