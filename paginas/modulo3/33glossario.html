        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        .nav-button:disabled { opacity: 0.2; cursor: not-allowed; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; border-radius: 1rem; }
        .aspect-h-9 { padding-bottom: 56.25%; }
        .aspect-w-16 { position: relative; height: 0; }
        .aspect-w-16 > * { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .accordion-content { overflow: hidden; max-height: 0; transition: max-height 0.5s cubic-bezier(0.2, 0.9, 0.3, 1); }
        .accordion-header.active .accordion-chevron { transform: rotate(90deg); }
        #modal.hidden { display: none; }
        .custom-ordered-list { list-style: none; counter-reset: list-counter; padding-left: 0; }
        .custom-ordered-list li { counter-increment: list-counter; position: relative; padding-left: 2.5rem; margin-bottom: 0.75rem; }
        .custom-ordered-list li::before {
            content: counter(list-counter);
            position: absolute;
            left: 0;
            top: 0.1em;
            width: 1.5rem;
            height: 1.5rem;
            background-color: #334155;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* === Estilos dos flipcards === */
        .flipcard-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 40px auto;
        }
        .flipcard {
            background-color: transparent;
            width: 200px;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
        }
        .flipcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flipcard.flipped .flipcard-inner {
            transform: rotateY(180deg);
        }
        .flipcard-front, .flipcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            backface-visibility: hidden;
            overflow: hidden;
        }
        .flipcard-front {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            padding: 10px;
        }
        .flipcard-back {
            transform: rotateY(180deg);
            background-color: #000;
        }
        .flipcard-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const carouselElement = document.getElementById('carousel');
    if (carouselElement) {
        const track = carouselElement.querySelector('.carousel-track');
        const slides = track ? Array.from(track.children) : [];
        const nextButton = document.getElementById('nextBtn');
        const prevButton = document.getElementById('prevBtn');
        const dotsContainer = document.getElementById('dots-container');
        let currentIndex = 0;
        const loadSlideContent = (index) => {
            const slide = slides[index];
            if (!slide) return;
            const img = slide.querySelector('img');
            if (img && img.dataset.src) {
                img.src = img.dataset.src;
                img.removeAttribute('data-src');
            }
        };
        const moveToSlide = (targetIndex) => {
            if (targetIndex < 0 || targetIndex >= slides.length || slides.length === 0) return;
            const slideWidth = slides[0].getBoundingClientRect().width;
            if (!slideWidth || !track) return;
            loadSlideContent(targetIndex);
            track.style.transform = `translateX(-${slideWidth * targetIndex}px)`;
            currentIndex = targetIndex;
            updateUI();
        };
        const updateUI = () => {
            if (!dotsContainer || !prevButton || !nextButton) return;
            const dots = Array.from(dotsContainer.children);
            dots.forEach((dot, index) => {
                dot.classList.toggle('bg-white', index === currentIndex);
                dot.classList.toggle('bg-white/50', index !== currentIndex);
            });
            prevButton.disabled = (currentIndex === 0);
            nextButton.disabled = (currentIndex === slides.length - 1);
        };
        const setupCarousel = () => {
            if (slides.length === 0 || !dotsContainer || !track) return;
            dotsContainer.innerHTML = '';
            slides.forEach((_, index) => {
                const dot = document.createElement('button');
                dot.classList.add('w-3', 'h-3', 'rounded-full', 'transition-colors');
                dotsContainer.appendChild(dot);
                dot.addEventListener('click', () => moveToSlide(index));
            });
            const slideWidth = slides.length > 0 ? slides[0].getBoundingClientRect().width : 0;
            if (!slideWidth) return;
            track.style.transition = 'none';
            track.style.transform = `translateX(-${slideWidth * currentIndex}px)`;
            setTimeout(() => { if(track) track.style.transition = 'transform 0.5s ease-in-out'; }, 50);
            updateUI();
            loadSlideContent(currentIndex);
        };
        if (nextButton && prevButton) {
            nextButton.addEventListener('click', () => moveToSlide(currentIndex + 1));
            prevButton.addEventListener('click', () => moveToSlide(currentIndex - 1));
        }
        window.addEventListener('resize', setupCarousel);
        setTimeout(setupCarousel, 100);
    }
    const accordionHeaders = document.querySelectorAll('.accordion-header');
    accordionHeaders.forEach(header => {
        header.addEventListener('click', () => {
            const accordionItem = header.parentElement;
            const accordionContent = header.nextElementSibling;
            if (!accordionItem || !accordionContent) return;
            header.classList.toggle('active');
            if (accordionContent.style.maxHeight) {
                accordionContent.style.maxHeight = null;
                accordionItem.classList.remove('open');
            } else {
                accordionContent.style.maxHeight = accordionContent.scrollHeight + 'px';
                accordionItem.classList.add('open');
            }
        });
    });
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modal-content');
    if (openModalBtn && closeModalBtn && modal && modalContent) {
        const openModal = () => {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('opacity-100');
                modalContent.classList.add('scale-100');
            }, 10);
        };
        const closeModal = () => {
            modal.classList.remove('opacity-100');
            modalContent.classList.remove('scale-100');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        };
        openModalBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (event) => {
            if (event.target === modal) closeModal();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
                closeModal();
            }
        });
    }
});
</script>
