<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Atividade Interativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos base para uma aparência mais limpa */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .carousel-track { transition: transform 0.5s ease-in-out; }
        .nav-button:disabled { opacity: 0.2; cursor: not-allowed; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; border-radius: 1rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex items-center justify-center min-h-screen p-4 sm:p-8 lg:p-12">

    <!-- ============================================= -->
    <!-- ==    INÍCIO: Bloco da Atividade Principal   == -->
    <!-- ============================================= -->
    <main class="w-full max-w-7xl mx-auto flex flex-col md:flex-row gap-8 md:gap-12 items-start">

        <!-- Coluna da Esquerda: O Carrossel -->
        <div class="flex-1 w-full flex justify-center md:justify-end transition-transform duration-300 hover:-translate-y-1">
            <!-- MUDANÇA: 'max-w-md' foi removido para permitir que o carrossel se ajuste ao espaço -->
            <div id="carousel" class="w-full aspect-[3/4] relative overflow-hidden rounded-2xl shadow-2xl">
                <div class="carousel-track h-full flex">
                    <div class="carousel-slide h-full flex-shrink-0 w-full relative">
                        <img data-src="https://raw.githubusercontent.com/humbertoman/gifs_notion/main/gifs/diferente.gif" alt="GIF 1">
                        <div class="absolute bottom-0 left-0 right-0 p-4 bg-black/50 backdrop-blur-sm rounded-b-2xl"><h3 class="text-white text-center font-semibold">Sinal 1: DIFERENTE</h3></div>
                    </div>
                    <div class="carousel-slide h-full flex-shrink-0 w-full relative">
                        <img data-src="https://media.giphy.com/media/VbnUQpnihPSIgIXuZv/giphy.gif" alt="GIF 2">
                        <div class="absolute bottom-0 left-0 right-0 p-4 bg-black/50 backdrop-blur-sm rounded-b-2xl"><h3 class="text-white text-center font-semibold">Sinal 2: CÓDIGO</h3></div>
                    </div>
                </div>
                <button id="prevBtn" class="nav-button absolute left-4 top-1/2 -translate-y-1/2 bg-white/40 backdrop-blur-sm p-2 rounded-full text-slate-800 hover:bg-white/60 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                <button id="nextBtn" class="nav-button absolute right-4 top-1/2 -translate-y-1/2 bg-white/40 backdrop-blur-sm p-2 rounded-full text-slate-800 hover:bg-white/60 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                <div id="dots-container" class="absolute bottom-16 left-1/2 -translate-x-1/2 flex space-x-2"></div>
            </div>
        </div>

        <!-- Coluna da Direita: O Questionário -->
        <div class="flex-1 w-full flex justify-center md:justify-start transition-transform duration-300 hover:-translate-y-1">
             <!-- MUDANÇA: 'max-w-md' foi removido para permitir que o formulário se ajuste ao espaço -->
             <div class="w-full h-[700px]">
                <iframe class="w-full h-full rounded-2xl shadow-2xl border border-slate-200/50" src="https://docs.google.com/forms/d/e/1FAIpQLSfYbE46iFIlBBsFpUHbfVVWEpb-P3-vAoMUeMFvIB1wXFrQ0w/viewform?embedded=true">Carregando…</iframe>
            </div>
        </div>
    </main>
    <!-- ============================================= -->
    <!-- ==      FIM: Bloco da Atividade Principal    == -->
    <!-- ============================================= -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- CÓDIGO DO CARROSSEL ---
            const track = document.querySelector('.carousel-track');
            if (track) {
                const slides = Array.from(track.children);
                const nextButton = document.getElementById('nextBtn');
                const prevButton = document.getElementById('prevBtn');
                const dotsContainer = document.getElementById('dots-container');
                let currentIndex = 0;
                const loadSlideContent = (index) => { const slide = slides[index]; if (!slide) return; const img = slide.querySelector('img'); if (img && img.dataset.src) { img.src = img.dataset.src; img.removeAttribute('data-src'); } };
                const moveToSlide = (targetIndex) => { const slideWidth = slides[0].getBoundingClientRect().width; if (!slideWidth) return; loadSlideContent(targetIndex); track.style.transform = `translateX(-${slideWidth * targetIndex}px)`; currentIndex = targetIndex; updateUI(); };
                const updateUI = () => { const dots = Array.from(dotsContainer.children); dots.forEach((dot, index) => { dot.classList.toggle('bg-white', index === currentIndex); dot.classList.toggle('bg-white/50', index !== currentIndex); }); prevButton.disabled = (currentIndex === 0); nextButton.disabled = (currentIndex === slides.length - 1); };
                const setupCarousel = () => { dotsContainer.innerHTML = ''; slides.forEach((_, index) => { const dot = document.createElement('button'); dot.classList.add('w-3', 'h-3', 'rounded-full', 'transition-colors'); dotsContainer.appendChild(dot); dot.addEventListener('click', () => moveToSlide(index)); }); const slideWidth = slides[0].getBoundingClientRect().width; if (!slideWidth) return; track.style.transition = 'none'; track.style.transform = `translateX(-${slideWidth * currentIndex}px)`; setTimeout(() => { track.style.transition = 'transform 0.5s ease-in-out'; }, 50); updateUI(); loadSlideContent(currentIndex); };
                if (slides.length > 0) {
                    nextButton.addEventListener('click', () => { if (currentIndex < slides.length - 1) { moveToSlide(currentIndex + 1); } });
                    prevButton.addEventListener('click', () => { if (currentIndex > 0) { moveToSlide(currentIndex - 1); } });
                    window.addEventListener('resize', setupCarousel);
                    setTimeout(setupCarousel, 100);
                }
            }
        });
    </script>
</body>
</html>
