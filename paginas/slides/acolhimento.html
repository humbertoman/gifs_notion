<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Equipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .student-chip {
            cursor: grab;
            transition: all 0.2s ease;
        }
        .student-chip:active {
            cursor: grabbing;
        }
        .drop-zone {
            min-height: 120px;
            transition: background-color 0.3s border-color 0.3s;
        }
        .drag-over {
            background-color: #f0fdf4;
            border-color: #22c55e;
            border-style: dashed;
        }
        .dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800">Divisão de Equipes</h1>
            <p class="text-slate-600">Insira os nomes e arraste para os grupos</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Painel de Entrada -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-semibold mb-4 text-slate-700">1. Lista de Alunos</h2>
                    <textarea 
                        id="namesInput" 
                        class="w-full h-48 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm"
                        placeholder="Digite um nome por linha..."
                    ></textarea>
                    <button 
                        onclick="generateStudents()" 
                        class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition"
                    >
                        Carregar Alunos
                    </button>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-semibold mb-2 text-slate-700">Alunos sem Equipe</h2>
                    <p class="text-xs text-slate-500 mb-4">Arraste os nomes daqui para as equipes.</p>
                    <div 
                        id="unassigned" 
                        class="drop-zone flex flex-wrap gap-2 p-2 border-2 border-transparent rounded-lg"
                        ondragover="allowDrop(event)" 
                        ondrop="drop(event)"
                    >
                        <!-- Alunos aparecerão aqui -->
                    </div>
                </div>
            </div>

            <!-- Painel das Equipes -->
            <div class="lg:col-span-3">
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    <!-- Equipe 1 -->
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-blue-800">Equipe 1</h3>
                            <span class="count bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-0.5 rounded-full" id="count-team1">0</span>
                        </div>
                        <div id="team1" class="drop-zone border-2 border-slate-100 rounded-lg p-2" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
                    </div>

                    <!-- Equipe 2 -->
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-green-800">Equipe 2</h3>
                            <span class="count bg-green-100 text-green-700 text-xs font-bold px-2.5 py-0.5 rounded-full" id="count-team2">0</span>
                        </div>
                        <div id="team2" class="drop-zone border-2 border-slate-100 rounded-lg p-2" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
                    </div>

                    <!-- Equipe 3 -->
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-purple-800">Equipe 3</h3>
                            <span class="count bg-purple-100 text-purple-700 text-xs font-bold px-2.5 py-0.5 rounded-full" id="count-team3">0</span>
                        </div>
                        <div id="team3" class="drop-zone border-2 border-slate-100 rounded-lg p-2" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
                    </div>

                    <!-- Equipe 4 -->
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-orange-800">Equipe 4</h3>
                            <span class="count bg-orange-100 text-orange-700 text-xs font-bold px-2.5 py-0.5 rounded-full" id="count-team4">0</span>
                        </div>
                        <div id="team4" class="drop-zone border-2 border-slate-100 rounded-lg p-2" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
                    </div>

                    <!-- Equipe 5 -->
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-rose-800">Equipe 5</h3>
                            <span class="count bg-rose-100 text-rose-700 text-xs font-bold px-2.5 py-0.5 rounded-full" id="count-team5">0</span>
                        </div>
                        <div id="team5" class="drop-zone border-2 border-slate-100 rounded-lg p-2" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
                    </div>

                    <!-- Equipe 6 -->
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-teal-800">Equipe 6</h3>
                            <span class="count bg-teal-100 text-teal-700 text-xs font-bold px-2.5 py-0.5 rounded-full" id="count-team6">0</span>
                        </div>
                        <div id="team6" class="drop-zone border-2 border-slate-100 rounded-lg p-2" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
                    </div>
                </div>
                
                <div class="mt-8 flex justify-end gap-4">
                    <button onclick="clearTeams()" class="px-4 py-2 text-slate-600 hover:text-slate-800 text-sm font-medium">Limpar Tudo</button>
                    <button onclick="exportResult()" class="px-6 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-medium transition shadow-md">Exportar TXT</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let studentIdCounter = 0;

        function generateStudents() {
            const input = document.getElementById('namesInput');
            const container = document.getElementById('unassigned');
            const lines = input.value.split('\n').filter(line => line.trim() !== "");

            if (lines.length === 0) return;

            // Limpa o que já existe
            container.innerHTML = '';
            clearCounts();

            lines.forEach(name => {
                createStudentElement(name.trim(), container);
            });
            
            updateAllCounts();
        }

        function createStudentElement(name, targetContainer) {
            const id = 'student-' + studentIdCounter++;
            const el = document.createElement('div');
            el.id = id;
            el.className = 'student-chip bg-white border border-slate-200 px-3 py-1.5 rounded-md text-sm shadow-sm hover:shadow-md hover:border-blue-300 text-slate-700 select-none';
            el.draggable = true;
            el.innerText = name;

            el.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
                e.target.classList.add('dragging');
            });

            el.addEventListener('dragend', (e) => {
                e.target.classList.remove('dragging');
            });

            targetContainer.appendChild(el);
        }

        function allowDrop(e) {
            e.preventDefault();
            const zone = e.currentTarget;
            if (zone.classList.contains('drop-zone')) {
                zone.classList.add('drag-over');
            }
        }

        // Remover classe de destaque quando o item sai ou é solto
        document.querySelectorAll('.drop-zone').forEach(zone => {
            zone.addEventListener('dragleave', (e) => {
                e.currentTarget.classList.remove('drag-over');
            });
        });

        function drop(e) {
            e.preventDefault();
            const zone = e.currentTarget;
            zone.classList.remove('drag-over');
            
            const data = e.dataTransfer.getData('text/plain');
            const draggedElement = document.getElementById(data);
            
            if (draggedElement && zone.classList.contains('drop-zone')) {
                zone.appendChild(draggedElement);
                updateAllCounts();
            }
        }

        function updateAllCounts() {
            const zones = ['team1', 'team2', 'team3', 'team4', 'team5', 'team6'];
            zones.forEach(id => {
                const count = document.getElementById(id).children.length;
                document.getElementById('count-' + id).innerText = count;
            });
        }

        function clearCounts() {
            const counts = document.querySelectorAll('.count');
            counts.forEach(c => c.innerText = '0');
            // Também limpa os containers de times
            const zones = ['team1', 'team2', 'team3', 'team4', 'team5', 'team6'];
            zones.forEach(id => document.getElementById(id).innerHTML = '');
        }

        function clearTeams() {
            document.getElementById('namesInput').value = '';
            document.getElementById('unassigned').innerHTML = '';
            clearCounts();
        }

        function exportResult() {
            let output = "DIVISÃO DE EQUIPES\n==================\n\n";
            const zones = ['team1', 'team2', 'team3', 'team4', 'team5', 'team6'];
            
            zones.forEach((id, index) => {
                const teamName = "EQUIPE " + (index + 1);
                output += teamName + ":\n";
                const students = document.getElementById(id).children;
                if (students.length === 0) {
                    output += "(Vazia)\n";
                } else {
                    Array.from(students).forEach(s => {
                        output += "- " + s.innerText + "\n";
                    });
                }
                output += "\n";
            });

            const blob = new Blob([output], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'equipes_formadas.txt';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
