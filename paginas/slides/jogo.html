<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Palavras Cruzadas - Lei 8.112/1990</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #1a4d2e;
            --secondary: #4f772d;
            --accent: #90a955;
            --bg: #faf9f6;
            --text: #2d3436;
            --correct: #27ae60;
            --border: #dfe6e9;
            --shadow: rgba(26, 77, 46, 0.08);
            --selected: rgba(144, 169, 85, 0.2);
        }

        body {
            font-family: 'Crimson Pro', serif;
            background: linear-gradient(135deg, var(--bg) 0%, #f0ebe3 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(144, 169, 85, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 30px) scale(1.1); }
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
            text-shadow: 2px 2px 0 rgba(144, 169, 85, 0.1);
        }

        .subtitle {
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .level-selector {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            overflow-x: auto;
            padding: 0.5rem 0;
            -webkit-overflow-scrolling: touch;
        }

        .level-btn {
            font-family: 'DM Mono', monospace;
            padding: 0.7rem 1.2rem;
            border: 2px solid var(--secondary);
            background: white;
            color: var(--secondary);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            white-space: nowrap;
            flex-shrink: 0;
            touch-action: manipulation;
        }

        .level-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--secondary);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
        }

        .level-btn.active::before {
            left: 0;
        }

        .level-btn.active {
            color: white;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .game-info {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .hints-container {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .hint-btn, .reveal-btn {
            font-family: 'DM Mono', monospace;
            padding: 0.7rem 1rem;
            border: 2px solid var(--accent);
            background: white;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 8px;
            touch-action: manipulation;
            flex: 1;
            min-width: 120px;
        }

        .reveal-btn {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .hint-btn:active:not(:disabled), .reveal-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .hint-btn:disabled, .reveal-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .hints-used {
            font-family: 'DM Mono', monospace;
            color: var(--secondary);
            font-size: 0.85rem;
            width: 100%;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--accent));
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
        }

        .crossword-container {
            margin-bottom: 1.5rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem 0;
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background: var(--border);
            padding: 1px;
            box-shadow: 0 6px 20px var(--shadow);
            border-radius: 8px;
            width: fit-content;
            margin: 0 auto;
            min-width: min-content;
        }

        .cell {
            width: 32px;
            height: 32px;
            background: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Mono', monospace;
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--text);
            transition: all 0.2s ease;
            position: relative;
            cursor: pointer;
        }

        .cell.black {
            background: var(--text);
            cursor: default;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-family: 'DM Mono', monospace;
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--text);
            outline: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            caret-color: var(--secondary);
        }

        .cell.selected {
            background: var(--selected) !important;
            box-shadow: inset 0 0 0 2px var(--secondary);
        }

        .cell.highlighted {
            background: rgba(144, 169, 85, 0.1) !important;
        }

        .cell.correct {
            background: var(--correct) !important;
            color: white;
            animation: celebrate 0.6s ease;
        }

        .cell.correct input {
            color: white;
        }

        .cell.revealed {
            background: #fff8dc !important;
            animation: revealPulse 0.5s ease;
        }

        .cell.revealed input {
            color: var(--secondary);
            font-weight: 600;
        }

        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15) rotate(-5deg); }
            75% { transform: scale(1.15) rotate(5deg); }
        }

        @keyframes revealPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .cell .number {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 0.5rem;
            color: var(--secondary);
            font-weight: 500;
            pointer-events: none;
        }

        .cell.correct .number {
            color: white;
        }

        .word-selector {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow);
            margin-bottom: 1rem;
            display: none;
        }

        .word-selector.show {
            display: block;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .word-selector h3 {
            font-size: 1rem;
            color: var(--primary);
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .word-options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .word-option {
            font-family: 'DM Mono', monospace;
            padding: 0.6rem 1rem;
            border: 2px solid var(--border);
            background: white;
            color: var(--text);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 8px;
            touch-action: manipulation;
        }

        .word-option:active {
            transform: scale(0.95);
        }

        .word-option.max-reveals {
            opacity: 0.5;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .clues {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .clue-section {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .clue-section h3 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent);
        }

        .clue {
            margin-bottom: 0.8rem;
            padding: 0.5rem;
            font-size: 0.95rem;
            line-height: 1.5;
            transition: all 0.3s ease;
            cursor: pointer;
            border-radius: 6px;
        }

        .clue:hover {
            background: rgba(144, 169, 85, 0.05);
        }

        .clue.solved {
            color: var(--correct);
            text-decoration: line-through;
            opacity: 0.6;
        }

        .clue-number {
            font-family: 'DM Mono', monospace;
            font-weight: 600;
            color: var(--secondary);
            margin-right: 0.5rem;
        }

        .hint-display {
            background: linear-gradient(135deg, #fff8e1 0%, #ffe0b2 100%);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border-left: 4px solid var(--accent);
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.2);
            animation: slideDown 0.4s ease;
            display: none;
        }

        .hint-display.show {
            display: block;
        }

        .hint-display strong {
            font-family: 'DM Mono', monospace;
            color: #f57c00;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .hint-display p {
            margin-top: 0.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .completion-message {
            background: linear-gradient(135deg, var(--correct) 0%, #2ecc71 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            margin-top: 1.5rem;
            box-shadow: 0 8px 30px rgba(39, 174, 96, 0.3);
            animation: slideDown 0.5s ease;
            display: none;
        }

        .completion-message.show {
            display: block;
        }

        .completion-message h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 480px) {
            body { padding: 0.5rem; }
            h1 { font-size: 1.5rem; }
            .subtitle { font-size: 0.65rem; }
            .level-btn { padding: 0.6rem 1rem; font-size: 0.7rem; }
            .cell { width: 28px; height: 28px; font-size: 0.85rem; }
            .cell input { font-size: 0.85rem; }
            .cell .number { font-size: 0.45rem; }
            .clue { font-size: 0.9rem; }
            .hint-btn, .reveal-btn { font-size: 0.7rem; padding: 0.6rem 0.8rem; min-width: 100px; }
        }

        @media (max-width: 896px) and (orientation: landscape) {
            body { padding: 0.5rem; }
            header { margin-bottom: 1rem; padding-bottom: 0.5rem; }
            h1 { font-size: 1.3rem; }
            .game-info { padding: 0.75rem; }
            .clue-section { padding: 1rem; }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .cell { width: 36px; height: 36px; font-size: 1rem; }
            .cell input { font-size: 1rem; }
        }

        @media (min-width: 769px) {
            .container { max-width: 1200px; }
            .cell { width: 40px; height: 40px; font-size: 1.1rem; }
            .cell input { font-size: 1.1rem; }
            .clues { display: grid; grid-template-columns: 1fr 1fr; }
            .game-info { flex-direction: row; align-items: center; }
            .hints-container { justify-content: flex-start; }
            .hints-used { width: auto; }
            .progress-bar { margin-left: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>

        <div class="game-info">

                <span class="hints-used" id="hintsUsed">Dicas: 0/3</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

        <div class="word-selector" id="wordSelector">

        <div class="crossword-container">

        <div class="clues">

            <div class="clue-section">

        <div class="completion-message" id="completionMessage">

                    ['#', 'I', '#', '#', '#', '#', '#', '#', '#', '#', 'L'],
                    ['P', 'A', 'U', 'S', 'A', '#', '#', '#', '#', '#', 'A'],
                    ['#', 'U', '#', '#', '#', '#', '#', '#', '#', '#', 'D'],
                    ['#', 'R', '#', '#', 'P', 'R', 'O', 'M', 'O', 'C', 'A', 'O'],
                    ['#', 'A', '#', '#', '#', '#', '#', '#', '#', '#', '#']
                ],
                across: {
                    1: "Processo administrativo contra servidor (11 letras)",
                    3: "Retorno do servidor demitido ilegalmente (12 letras)",
                    6: "Adicional por tempo de serviço a cada 5 anos (9 letras)",
                    8: "Interrupção temporária do processo (5 letras)",
                    10: "Ascensão funcional na carreira (8 letras)"
                },
                down: {
                    2: "Período de apuração de falta (11 letras)",
                    4: "Acúmulo de cargos (11 letras)"
                },
                hints: [
                    "SINDICÂNCIA é processo preliminar de investigação.",
                    "REINTEGRAÇÃO restaura todos os direitos do servidor.",
                    "QUINQUÊNIO é concedido a cada cinco anos."
                ],
                positions: {
                    1: {row: 0, col: 0, dir: 'across', answer: 'SINDICANCIA'},
                    2: {row: 0, col: 1, dir: 'down', answer: 'INVESTIDURA'},
                    3: {row: 2, col: 3, dir: 'across', answer: 'REINTEGRACAO'},
                    4: {row: 2, col: 10, dir: 'down', answer: 'ACUMULACAO'},
                    6: {row: 5, col: 5, dir: 'across', answer: 'QUINQUENIO'},
                    8: {row: 7, col: 0, dir: 'across', answer: 'PAUSA'},
                    10: {row: 9, col: 4, dir: 'across', answer: 'PROMOCAO'}
                }
            },
            5: {
                name: "Nível 5 - Expert",
                grid: [
                    ['R', 'E', 'S', 'P', 'O', 'N', 'S', 'A', 'B', 'I', 'L', 'I', 'D', 'A', 'D', 'E'],
                    ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', 'M', '#', '#', '#', '#'],
                    ['I', 'N', 'C', 'O', 'M', 'P', 'A', 'T', 'I', 'B', 'I', 'L', 'I', 'D', 'A', 'D', 'E'],
                    ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', 'P', '#', '#', '#', '#'],
                    ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', 'R', '#', '#', '#', '#'],
                    ['#', '#', 'D', 'I', 'S', 'P', 'O', 'N', 'I', 'B', 'I', 'L', 'I', 'D', 'A', 'D', 'E'],
                    ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', 'O', '#', '#', '#', '#'],
                    ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', 'B', '#', '#', '#', '#'],
                    ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', 'I', '#', '#', '#', '#'],
                    ['#', '#', '#', '#', '#', '#', '#', '#', '#', '#', '#', 'D', '#', '#', '#', '#'],
                    ['#', '#', '#', '#', '#', 'P', 'R', 'E', 'S', 'C', 'R', 'I', 'C', 'A', 'O', '#']
                ],
                across: {
                    1: "Dever funcional do servidor público (16 letras)",
                    3: "Impedimento para acumulação de cargos (17 letras)",
                    6: "Situação de servidor sem exercício (15 letras)",
                    11: "Perda do direito de punir por decurso de prazo (10 letras)"
                },
                down: {
                    2: "Contrapartida à responsabilidade (11 letras)"
                },
                hints: [
                    "RESPONSABILIDADE é princípio fundamental do servidor.",
                    "INCOMPATIBILIDADE impede acumular certos cargos.",
                    "IMPROBIDADE é a contrapartida negativa à responsabilidade."
                ],
                positions: {
                    1: {row: 0, col: 0, dir: 'across', answer: 'RESPONSABILIDADE'},
                    2: {row: 0, col: 11, dir: 'down', answer: 'IMPROBIDADE'},
                    3: {row: 2, col: 0, dir: 'across', answer: 'INCOMPATIBILIDADE'},
                    6: {row: 5, col: 2, dir: 'across', answer: 'DISPONIBILIDADE'},
                    11: {row: 10, col: 5, dir: 'across', answer: 'PRESCRICAO'}
                }
            }
        };

        let currentLevel = 1;
        let hintsUsed = 0;
        let solvedWords = new Set();
        let revealedLetters = {};
        let selectedWordNum = null;
        let selectedDir = null;

        function initGame() {
            createLevelButtons();
            loadLevel(1);
        }

        function createLevelButtons() {
            const selector = document.getElementById('levelSelector');
            for (let i = 1; i <= Object.keys(levels).length; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-btn' + (i === 1 ? ' active' : '');
                btn.textContent = `Nível ${i}`;
                btn.onclick = () => loadLevel(i);
                selector.appendChild(btn);
            }
        }

        function loadLevel(level) {
            currentLevel = level;
            hintsUsed = 0;
            solvedWords = new Set();
            revealedLetters = {};
            selectedWordNum = null;
            selectedDir = null;
            
            document.querySelectorAll('.level-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === level);
            });
            
            updateHintsDisplay();
            document.getElementById('hintDisplay').classList.remove('show');
            document.getElementById('wordSelector').classList.remove('show');
            document.getElementById('completionMessage').classList.remove('show');
            
            renderCrossword();
            renderClues();
            updateProgress();
        }

        function renderCrossword() {
            const level = levels[currentLevel];
            const container = document.getElementById('crosswordContainer');
            const grid = document.createElement('div');
            grid.className = 'crossword-grid';
            
            const screenWidth = window.innerWidth;
            let cellSize = 32;
            if (screenWidth < 480) cellSize = 28;
            else if (screenWidth < 768) cellSize = 36;
            else if (screenWidth >= 769) cellSize = 40;
            
            grid.style.gridTemplateColumns = `repeat(${level.grid[0].length}, ${cellSize}px)`;
            
            level.grid.forEach((row, i) => {
                row.forEach((cell, j) => {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'cell';
                    cellDiv.dataset.row = i;
                    cellDiv.dataset.col = j;
                    
                    if (cell === '#') {
                        cellDiv.classList.add('black');
                    } else {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.setAttribute('autocomplete', 'off');
                        input.setAttribute('autocorrect', 'off');
                        input.setAttribute('autocapitalize', 'characters');
                        input.setAttribute('spellcheck', 'false');
                        input.maxLength = 1;
                        input.dataset.row = i;
                        input.dataset.col = j;
                        input.dataset.answer = cell;
                        input.addEventListener('input', handleInput);
                        input.addEventListener('keydown', handleKeyDown);
                        input.addEventListener('focus', handleFocus);
                        cellDiv.appendChild(input);
                        
                        // Adicionar número se for início de palavra
                        for (let [num, pos] of Object.entries(level.positions)) {
                            if (pos.row === i && pos.col === j) {
                                const numSpan = document.createElement('span');
                                numSpan.className = 'number';
                                numSpan.textContent = num;
                                cellDiv.appendChild(numSpan);
                                break;
                            }
                        }
                        
                        // Adicionar evento de clique na célula
                        cellDiv.addEventListener('click', () => {
                            input.focus();
                            selectWordAtCell(i, j);
                        });
                    }
                    
                    grid.appendChild(cellDiv);
                });
            });
            
            container.innerHTML = '';
            container.appendChild(grid);
        }

        function handleFocus(e) {
            const input = e.target;
            const row = parseInt(input.dataset.row);
            const col = parseInt(input.dataset.col);
            selectWordAtCell(row, col);
        }

        function selectWordAtCell(row, col) {
            const level = levels[currentLevel];
            
            // Encontrar palavra na posição clicada
            for (let [num, pos] of Object.entries(level.positions)) {
                if (solvedWords.has(num)) continue;
                
                const isInWord = pos.dir === 'across' 
                    ? (row === pos.row && col >= pos.col && col < pos.col + pos.answer.length)
                    : (col === pos.col && row >= pos.row && row < pos.row + pos.answer.length);
                
                if (isInWord) {
                    // Se já estava selecionada, troca direção (se houver palavra cruzada)
                    if (selectedWordNum === num) {
                        // Procura palavra na outra direção
                        const otherDir = pos.dir === 'across' ? 'down' : 'across';
                        for (let [otherNum, otherPos] of Object.entries(level.positions)) {
                            if (solvedWords.has(otherNum)) continue;
                            if (otherPos.dir === otherDir) {
                                const isInOther = otherDir === 'across'
                                    ? (row === otherPos.row && col >= otherPos.col && col < otherPos.col + otherPos.answer.length)
                                    : (col === otherPos.col && row >= otherPos.row && row < otherPos.row + otherPos.answer.length);
                                if (isInOther) {
                                    highlightWord(otherNum, otherPos);
                                    return;
                                }
                            }
                        }
                    }
                    
                    highlightWord(num, pos);
                    return;
                }
            }
        }

        function highlightWord(num, pos) {
            selectedWordNum = num;
            selectedDir = pos.dir;
            
            // Remove destaques anteriores
            document.querySelectorAll('.cell').forEach(c => {
                c.classList.remove('selected', 'highlighted');
            });
            
            // Destaca palavra selecionada
            const cells = document.querySelectorAll('.cell');
            for (let i = 0; i < pos.answer.length; i++) {
                const targetRow = pos.dir === 'across' ? pos.row : pos.row + i;
                const targetCol = pos.dir === 'across' ? pos.col + i : pos.col;
                
                cells.forEach(cell => {
                    if (parseInt(cell.dataset.row) === targetRow && 
                        parseInt(cell.dataset.col) === targetCol) {
                        cell.classList.add('highlighted');
                    }
                });
            }
        }

        function handleInput(e) {
            const input = e.target;
            let value = input.value.toUpperCase();
            
            if (value.length > 1) {
                value = value.charAt(value.length - 1);
            }
            
            input.value = value;
            
            if (value) {
                setTimeout(() => checkWord(input), 50);
                
                // Navega automaticamente para próxima célula da palavra
                if (selectedWordNum && selectedDir) {
                    const row = parseInt(input.dataset.row);
                    const col = parseInt(input.dataset.col);
                    const pos = levels[currentLevel].positions[selectedWordNum];
                    
                    const nextRow = selectedDir === 'across' ? row : row + 1;
                    const nextCol = selectedDir === 'across' ? col + 1 : col;
                    
                    // Verifica se ainda está dentro da palavra
                    const inWord = selectedDir === 'across'
                        ? (nextRow === pos.row && nextCol >= pos.col && nextCol < pos.col + pos.answer.length)
                        : (nextCol === pos.col && nextRow >= pos.row && nextRow < pos.row + pos.answer.length);
                    
                    if (inWord) {
                        const nextInput = document.querySelector(`input[data-row="${nextRow}"][data-col="${nextCol}"]`);
                        if (nextInput && !nextInput.disabled) {
                            setTimeout(() => nextInput.focus(), 10);
                        }
                    }
                }
            }
        }

        function handleKeyDown(e) {
            const input = e.target;
            const row = parseInt(input.dataset.row);
            const col = parseInt(input.dataset.col);
            
            if (e.key === 'Backspace' && !input.value) {
                e.preventDefault();
                
                if (selectedWordNum && selectedDir) {
                    const pos = levels[currentLevel].positions[selectedWordNum];
                    const prevRow = selectedDir === 'across' ? row : row - 1;
                    const prevCol = selectedDir === 'across' ? col - 1 : col;
                    
                    const inWord = selectedDir === 'across'
                        ? (prevRow === pos.row && prevCol >= pos.col && prevCol < pos.col + pos.answer.length)
                        : (prevCol === pos.col && prevRow >= pos.row && prevRow < pos.row + pos.answer.length);
                    
                    if (inWord) {
                        const prevInput = document.querySelector(`input[data-row="${prevRow}"][data-col="${prevCol}"]`);
                        if (prevInput && !prevInput.disabled) {
                            prevInput.value = '';
                            setTimeout(() => prevInput.focus(), 10);
                        }
                    }
                }
            }
        }

        function checkWord(input) {
            const level = levels[currentLevel];
            const row = parseInt(input.dataset.row);
            const col = parseInt(input.dataset.col);
            
            for (let [num, pos] of Object.entries(level.positions)) {
                if (solvedWords.has(num)) continue;
                
                const isInWord = pos.dir === 'across' 
                    ? (row === pos.row && col >= pos.col && col < pos.col + pos.answer.length)
                    : (col === pos.col && row >= pos.row && row < pos.row + pos.answer.length);
                
                if (isInWord) {
                    const word = getWordFromPosition(pos);
                    if (word === pos.answer) {
                        markWordCorrect(pos, num);
                        solvedWords.add(num);
                        updateProgress();
                        checkLevelComplete();
                    }
                    return;
                }
            }
        }

        function getWordFromPosition(pos) {
            let word = '';
            const inputs = document.querySelectorAll('input');
            
            if (pos.dir === 'across') {
                for (let i = 0; i < pos.answer.length; i++) {
                    const input = Array.from(inputs).find(inp => 
                        parseInt(inp.dataset.row) === pos.row && 
                        parseInt(inp.dataset.col) === pos.col + i
                    );
                    word += input ? input.value : '';
                }
            } else {
                for (let i = 0; i < pos.answer.length; i++) {
                    const input = Array.from(inputs).find(inp => 
                        parseInt(inp.dataset.row) === pos.row + i && 
                        parseInt(inp.dataset.col) === pos.col
                    );
                    word += input ? input.value : '';
                }
            }
            
            return word.toUpperCase();
        }

        function markWordCorrect(pos, num) {
            const inputs = document.querySelectorAll('input');
            
            if (pos.dir === 'across') {
                for (let i = 0; i < pos.answer.length; i++) {
                    const input = Array.from(inputs).find(inp => 
                        parseInt(inp.dataset.row) === pos.row && 
                        parseInt(inp.dataset.col) === pos.col + i
                    );
                    if (input) {
                        input.parentElement.classList.remove('selected', 'highlighted');
                        input.parentElement.classList.add('correct');
                        input.disabled = true;
                    }
                }
            } else {
                for (let i = 0; i < pos.answer.length; i++) {
                    const input = Array.from(inputs).find(inp => 
                        parseInt(inp.dataset.row) === pos.row + i && 
                        parseInt(inp.dataset.col) === pos.col
                    );
                    if (input) {
                        input.parentElement.classList.remove('selected', 'highlighted');
                        input.parentElement.classList.add('correct');
                        input.disabled = true;
                    }
                }
            }
            
            // Marca dica como resolvida
            const clues = document.querySelectorAll('.clue');
            clues.forEach(clue => {
                if (clue.dataset.num === num) {
                    clue.classList.add('solved');
                }
            });
            
            // Limpa seleção
            selectedWordNum = null;
            selectedDir = null;
        }

        function updateProgress() {
            const level = levels[currentLevel];
            const totalWords = Object.keys(level.positions).length;
            const progress = (solvedWords.size / totalWords) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function checkLevelComplete() {
            const level = levels[currentLevel];
            const totalWords = Object.keys(level.positions).length;
            
            if (solvedWords.size === totalWords) {
                setTimeout(() => {
                    document.getElementById('completionMessage').classList.add('show');
                }, 500);
            }
        }

        function renderClues() {
            const level = levels[currentLevel];
            const acrossDiv = document.getElementById('acrossClues');
            const downDiv = document.getElementById('downClues');
            
            acrossDiv.innerHTML = '';
            downDiv.innerHTML = '';
            
            for (let [num, clue] of Object.entries(level.across)) {
                const clueDiv = document.createElement('div');
                clueDiv.className = 'clue';
                clueDiv.innerHTML = `<span class="clue-number">${num}.</span>${clue}`;
                clueDiv.dataset.num = num;
                clueDiv.onclick = () => selectWordByNumber(num);
                acrossDiv.appendChild(clueDiv);
            }
            
            for (let [num, clue] of Object.entries(level.down)) {
                const clueDiv = document.createElement('div');
                clueDiv.className = 'clue';
                clueDiv.innerHTML = `<span class="clue-number">${num}.</span>${clue}`;
                clueDiv.dataset.num = num;
                clueDiv.onclick = () => selectWordByNumber(num);
                downDiv.appendChild(clueDiv);
            }
        }

        function selectWordByNumber(num) {
            const level = levels[currentLevel];
            const pos = level.positions[num];
            
            if (pos && !solvedWords.has(num)) {
                highlightWord(num, pos);
                
                // Foca no primeiro input da palavra
                const firstInput = document.querySelector(
                    `input[data-row="${pos.row}"][data-col="${pos.col}"]`
                );
                if (firstInput && !firstInput.disabled) {
                    firstInput.focus();
                }
            }
        }

        function showHint() {
            if (hintsUsed >= 3) return;
            
            const level = levels[currentLevel];
            const hint = level.hints[hintsUsed];
            
            document.getElementById('hintText').textContent = hint;
            document.getElementById('hintDisplay').classList.add('show');
            
            hintsUsed++;
            updateHintsDisplay();
        }

        function updateHintsDisplay() {
            document.getElementById('hintsUsed').textContent = `Dicas: ${hintsUsed}/3`;
            document.getElementById('hintBtn').disabled = hintsUsed >= 3;
        }

        function toggleWordSelector() {
            const selector = document.getElementById('wordSelector');
            const isVisible = selector.classList.contains('show');
            
            if (!isVisible) {
                populateWordOptions();
                selector.classList.add('show');
            } else {
                selector.classList.remove('show');
            }
        }

        function populateWordOptions() {
            const level = levels[currentLevel];
            const optionsContainer = document.getElementById('wordOptions');
            optionsContainer.innerHTML = '';
            
            for (let [num, pos] of Object.entries(level.positions)) {
                if (solvedWords.has(num)) continue;
                
                const button = document.createElement('button');
                button.className = 'word-option';
                
                const revealsCount = revealedLetters[num] || 0;
                const direction = pos.dir === 'across' ? 'H' : 'V';
                
                button.textContent = `${num}${direction} (${revealsCount}/2)`;
                button.dataset.wordNum = num;
                
                if (revealsCount >= 2) {
                    button.classList.add('max-reveals');
                    button.disabled = true;
                } else {
                    button.onclick = () => revealLetterInWord(num);
                }
                
                optionsContainer.appendChild(button);
            }
        }

        function revealLetterInWord(wordNum) {
            const level = levels[currentLevel];
            const pos = level.positions[wordNum];
            
            if (!revealedLetters[wordNum]) {
                revealedLetters[wordNum] = 0;
            }
            
            if (revealedLetters[wordNum] >= 2) return;
            
            const inputs = document.querySelectorAll('input:not([disabled])');
            const wordCells = [];
            
            if (pos.dir === 'across') {
                for (let i = 0; i < pos.answer.length; i++) {
                    const input = Array.from(inputs).find(inp => 
                        parseInt(inp.dataset.row) === pos.row && 
                        parseInt(inp.dataset.col) === pos.col + i
                    );
                    if (input && !input.value && !input.parentElement.classList.contains('revealed')) {
                        wordCells.push({input, index: i});
                    }
                }
            } else {
                for (let i = 0; i < pos.answer.length; i++) {
                    const input = Array.from(inputs).find(inp => 
                        parseInt(inp.dataset.row) === pos.row + i && 
                        parseInt(inp.dataset.col) === pos.col
                    );
                    if (input && !input.value && !input.parentElement.classList.contains('revealed')) {
                        wordCells.push({input, index: i});
                    }
                }
            }
            
            if (wordCells.length === 0) {
                alert('Todas as letras desta palavra já foram reveladas ou preenchidas!');
                return;
            }
            
            const randomCell = wordCells[Math.floor(Math.random() * wordCells.length)];
            const correctLetter = pos.answer[randomCell.index];
            
            randomCell.input.value = correctLetter;
            randomCell.input.parentElement.classList.add('revealed');
            
            revealedLetters[wordNum]++;
            
            populateWordOptions();
            
            setTimeout(() => checkWord(randomCell.input), 100);
        }

        initGame();
    </script>
